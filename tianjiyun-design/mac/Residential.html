<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天机云 macOS 家宽线路</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.window{width:1280px;height:800px;background:#F2F4F7;border-radius:12px;overflow:hidden;display:flex;border:1px solid #BCC4CE;font-family:'Noto Sans SC',-apple-system,system-ui,sans-serif;color:#0E1726}
.side{width:220px;flex:none;background:#E6EAEF;border-right:1px solid #D2D8E0;padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.lights{display:flex;gap:8px;padding:2px 6px 22px}
.lights span{width:12px;height:12px;border-radius:50%}
.nav{display:flex;align-items:center;gap:10px;height:32px;padding:0 10px;border-radius:7px;color:#2D3748;text-decoration:none;font-size:13px}
.nav.on{background:#D3DAE3;color:#0E1726;font-weight:600}
.nav.on svg{color:#0A55F5}
.sec{font-size:11px;font-weight:600;color:#56616F;padding:12px 10px 4px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.tb{height:52px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #DCE1E7;background:#F7F8FA}
.content{flex:1;padding:20px 24px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.card{background:#fff;border:1px solid #DCE1E7;border-radius:14px}
.lbl{font-size:12px;color:#56616F}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;background:#EEF1F4;color:#2D3748;white-space:nowrap}
.chip.blue{background:#E6EEFE;color:#0842C2}
.chip.green{background:#E7F5EF;color:#0B6E4B}
.seg{display:inline-flex;background:#E4E8ED;border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;height:30px;padding:0 14px;border-radius:7px;font-size:13px;color:#4A5568;cursor:pointer}
.seg button.on{background:#fff;color:#0E1726;font-weight:600;box-shadow:0 1px 2px rgba(14,23,38,.14)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 14px;border-radius:8px;border:1px solid #DCE1E7;background:#fff;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;color:#0E1726;white-space:nowrap}
.btn.pri{background:#0A55F5;border-color:#0A55F5;color:#fff}
.rl{border:1px solid #DCE1E7;background:#fff;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;width:100%;position:relative}
.rl.sel{border-color:#0A55F5;box-shadow:0 0 0 3px #E6EEFE}
.rl.lock{background:#F7F8FA;cursor:not-allowed}
.rl.lock .nm{color:#56616F}
.cc{width:30px;height:20px;border-radius:4px;background:#0E1726;color:#fff;font-size:10px;display:grid;place-items:center;flex:none}
.rl.lock .cc{background:#8A94A3}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid #B8C1CC;flex:none}
.rl.sel .radio{border:5px solid #0A55F5}
.ok-t{color:#0B6E4B}.warn-t{color:#A15C00}
</style>
<!-- 精致化层（Apple 质感），必须在各页基础样式之后加载 -->
<link rel="stylesheet" href="../assets/polish.css">
<style>html{background:#D9DEE5}body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px}.__back{position:fixed;left:12px;top:10px;font:12px system-ui;color:#56616F;text-decoration:none;z-index:9999}</style>
</head>
<body>
<a class="__back" href="../index.html">← 全部页面</a>
<!-- 画板尺寸: 1280×800 -->
<div class="window">
  <nav class="side" aria-label="主导航">
    <div class="lights" aria-hidden="true"><span style="background: #FF5F57"></span><span style="background: #FEBC2E"></span><span style="background: #28C840"></span></div>
    <a class="nav" href="Dashboard.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>仪表盘</a>
    <a class="nav" href="../win/Proxies.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg>线路</a>
    <a class="nav on" href="Residential.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path><path d="M10 20v-5h4v5"></path></svg>家宽线路</a>
    <a class="nav" href="../win/Profiles.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5M10 13h6M10 17h6"></path></svg>订阅</a>
    <div class="sec">查看</div>
    <a class="nav" href="../win/Requests.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 4v16M4 17l3 3 3-3M17 20V4M14 7l3-3 3 3"></path></svg>连接</a>
    <a class="nav" href="../win/Logs.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>日志与诊断</a>
    <a class="nav" href="../linux/Dns.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"></path><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"></path></svg>DNS 与资源</a>
    <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px">
      <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#0E1726"></rect><circle cx="12" cy="12" r="6" fill="none" stroke="#fff" stroke-width="1.8"></circle><circle cx="16.5" cy="7.5" r="2.2" fill="#5B8CFF"></circle></svg>
      <div style="flex: 1"><div style="font-size: 13px; font-weight: 600">天机云</div><div class="lbl">剩余 28 天</div></div>
      <a href="../win/Settings.html" aria-label="设置" style="color: #4A5568"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></a>
    </div>
  </nav>
  <div class="main">
    <div class="tb">
      <div style="font-size: 15px; font-weight: 700">家宽线路</div>
      <div class="seg" role="group" aria-label="家宽用法"><button class="on">AI 与代理跟随所选家宽</button><button>按订阅分流</button></div>
    </div>
    <div class="content">
      <section class="card" style="padding: 18px 22px; display: flex; align-items: center; gap: 22px; box-shadow: inset 4px 0 0 #0A55F5" aria-label="当前使用中">
        <div><div class="lbl">当前使用中</div><div style="font-size: 20px; font-weight: 700; margin-top: 4px">东京家宽 · 04</div></div>
        <div style="width: 1px; height: 40px; background: #E5E9EE"></div>
        <div><div class="lbl">出口 IP</div><div class="mono" style="font-size: 16px; font-weight: 600; margin-top: 4px">203.0.113.42</div></div>
        <div><div class="lbl">运营商</div><div style="font-size: 16px; font-weight: 600; margin-top: 4px">SoftBank</div></div>
        <div><div class="lbl">本月家宽流量</div><div style="font-size: 16px; font-weight: 600; margin-top: 4px"><span class="mono">6.1</span> GB</div></div>
        <span style="flex: 1"></span>
        <span class="chip green">出口已校验</span>
      </section>

      <div style="display: flex; align-items: center; gap: 10px">
        <span style="font-size: 15px; font-weight: 700">可选家宽</span>
        <span class="lbl">7 条 · 你的套餐包含 5 条</span>
        <span style="flex: 1"></span>
        <button class="btn">测速</button>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <button class="rl sel" aria-pressed="true">
          <div style="display: flex; align-items: center; gap: 10px"><span class="mono cc">JP</span><span class="nm" style="font-size: 15px; font-weight: 700">东京家宽 · 04</span><span style="flex: 1"></span><span class="radio"></span></div>
          <div style="display: flex; gap: 6px"><span class="chip blue">独享</span><span class="chip">SoftBank</span><span class="chip">质量 优</span></div>
          <div class="lbl"><span class="mono ok-t" style="font-weight: 600">37 ms</span> · 当前线路</div>
        </button>
        <button class="rl" aria-pressed="false">
          <div style="display: flex; align-items: center; gap: 10px"><span class="mono cc">JP</span><span class="nm" style="font-size: 15px; font-weight: 700">大阪家宽 · 02</span><span style="flex: 1"></span><span class="radio"></span></div>
          <div style="display: flex; gap: 6px"><span class="chip">共享</span><span class="chip">NTT</span><span class="chip">质量 优</span></div>
          <div class="lbl"><span class="mono ok-t" style="font-weight: 600">44 ms</span></div>
        </button>
        <button class="rl" aria-pressed="false">
          <div style="display: flex; align-items: center; gap: 10px"><span class="mono cc">HK</span><span class="nm" style="font-size: 15px; font-weight: 700">香港家宽 · 01</span><span style="flex: 1"></span><span class="radio"></span></div>
          <div style="display: flex; gap: 6px"><span class="chip">共享</span><span class="chip">HKBN</span><span class="chip">质量 良</span></div>
          <div class="lbl"><span class="mono ok-t" style="font-weight: 600">42 ms</span></div>
        </button>
        <button class="rl" aria-pressed="false">
          <div style="display: flex; align-items: center; gap: 10px"><span class="mono cc">US</span><span class="nm" style="font-size: 15px; font-weight: 700">洛杉矶住宅 · 02</span><span style="flex: 1"></span><span class="radio"></span></div>
          <div style="display: flex; gap: 6px"><span class="chip blue">独享</span><span class="chip">AT&amp;T</span><span class="chip">质量 优</span></div>
          <div class="lbl"><span class="mono warn-t" style="font-weight: 600">142 ms</span></div>
        </button>
        <button class="rl" aria-pressed="false">
          <div style="display: flex; align-items: center; gap: 10px"><span class="mono cc">US</span><span class="nm" style="font-size: 15px; font-weight: 700">圣何塞住宅 · 01</span><span style="flex: 1"></span><span class="radio"></span></div>
          <div style="display: flex; gap: 6px"><span class="chip blue">独享</span><span class="chip">Verizon</span><span class="chip">质量 优</span></div>
          <div class="lbl"><span class="mono warn-t" style="font-weight: 600">171 ms</span></div>
        </button>
        <button class="rl lock" aria-disabled="true">
          <div style="display: flex; align-items: center; gap: 10px"><span class="mono cc">GB</span><span class="nm" style="font-size: 15px; font-weight: 700">伦敦家宽 · 01</span><span style="flex: 1"></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#56616F" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></div>
          <div style="display: flex; gap: 6px"><span class="chip">独享</span><span class="chip">BT</span></div>
          <div class="lbl">团队套餐可用 · <span style="color: #0842C2">升级</span></div>
        </button>
      </div>

      <div class="card" style="margin-top: auto; padding: 14px 18px; display: flex; gap: 14px; align-items: flex-start; background: #F7F8FA">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5568" stroke-width="1.8" aria-hidden="true" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.5"></path></svg>
        <div style="font-size: 13px; line-height: 1.7; color: #2D3748">切换后，AI 与需要代理的分组立刻改从新线路出去，连接会短暂重建。视频、下载等大流量仍走大带宽节点，不占家宽；大陆流量照常本地直连。<br>所选家宽故障时会先提示你，不会悄悄换到别的地区。</div>
        <span style="flex: 1"></span>
        <button class="btn pri">使用所选线路</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
