<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天机云 编辑订阅</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}button,input,textarea{font:inherit;color:inherit}
.w{width:1280px;height:800px;background:#EEF1F4;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;border:1px solid #C3CAD3;font-family:'Noto Sans SC',system-ui,sans-serif;color:#0E1726;position:relative}
.tb{height:32px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 12px;background:#F7F8FA;border-bottom:1px solid #DCE1E7;font-size:12px;color:#4A5568}
.bd{flex:1;display:flex;min-height:0}
.rail{width:220px;flex:none;background:#F7F8FA;border-right:1px solid #DCE1E7;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.nav{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:9px;color:#4A5568;text-decoration:none;font-size:14px}
.nav.on{background:#fff;color:#0E1726;font-weight:600;box-shadow:inset 0 0 0 1px #DCE1E7}
.nav.on svg{color:#0A55F5}
.main{flex:1;min-width:0;padding:20px 28px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
h1{margin:0;font-size:22px;font-weight:700}
.card{background:#fff;border:1px solid #DCE1E7;border-radius:14px}
.lbl{font-size:12px;color:#56616F}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;background:#EEF1F4;color:#2D3748;white-space:nowrap}
.chip.blue{background:#E6EEFE;color:#0842C2}.chip.green{background:#E7F5EF;color:#0B6E4B}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:9px;border:1px solid #DCE1E7;background:#fff;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;color:#0E1726;white-space:nowrap}
.btn.pri{background:#0A55F5;border-color:#0A55F5;color:#fff}
.tg{width:40px;height:24px;border-radius:12px;background:#B8C1CC;border:0;position:relative;flex:none;padding:0}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg.on{background:#0A55F5}.tg.on::after{left:19px}
.in{height:38px;padding:0 12px;border:1px solid #DCE1E7;border-radius:9px;background:#fff;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;width:100%}
.f{display:flex;flex-direction:column;gap:6px}
.fl{font-size:13px;font-weight:600}
.set{display:flex;align-items:center;gap:16px;padding:13px 0;border-top:1px solid #EEF1F4}
</style>
<!-- 精致化层（Apple 质感），必须在各页基础样式之后加载 -->
<link rel="stylesheet" href="../assets/polish.css">
<style>html{background:#D9DEE5}body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px}.__back{position:fixed;left:12px;top:10px;font:12px system-ui;color:#56616F;text-decoration:none;z-index:9999}</style>
</head>
<body>
<a class="__back" href="../index.html">← 全部页面</a>
<!-- 画板尺寸: 1280×800 -->
<div class="w">
  <div class="tb"><span>天机云</span><span style="letter-spacing: 22px">—▢✕</span></div>
  <div class="bd">
    <nav class="rail" aria-label="主导航">
      <div style="display: flex; align-items: center; gap: 10px; padding: 2px 8px 18px"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#0E1726"></rect><circle cx="12" cy="12" r="6" fill="none" stroke="#fff" stroke-width="1.8"></circle><circle cx="16.5" cy="7.5" r="2.2" fill="#5B8CFF"></circle></svg><div><div style="font-size: 16px; font-weight: 700">天机云</div><div style="font-size: 10px; letter-spacing: .16em; color: #56616F">TIANJI CLOUD</div></div></div>
      <a class="nav" href="../Main.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>仪表盘</a>
      <a class="nav" href="Proxies.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg>线路</a>
      <a class="nav on" href="Profiles.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5M10 13h6M10 17h6"></path></svg>订阅</a>
      <a class="nav" href="Requests.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 4v16M4 17l3 3 3-3M17 20V4M14 7l3-3 3 3"></path></svg>连接</a>
      <a class="nav" href="Logs.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>日志与诊断</a>
      <a class="nav" href="Settings.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>设置</a>
    </nav>
    <main class="main">
      <div style="display: flex; align-items: center; gap: 10px">
        <a href="Profiles.html" style="font-size: 14px; color: #56616F; text-decoration: none">订阅</a><span class="lbl">›</span><h1>编辑订阅</h1>
        <span style="flex: 1"></span><button class="btn">取消</button><button class="btn pri">保存</button>
      </div>
      <div style="flex: 1; min-height: 0; display: flex; gap: 14px">
        <section class="card" style="flex: 1; padding: 22px 24px; display: flex; flex-direction: column; gap: 16px" aria-label="订阅信息">
          <label class="f"><span class="fl">名称</span><input class="in" value="天机云 · AI 住宅原生 IP"></label>
          <label class="f"><span class="fl">订阅链接</span><span class="in mono" style="font-size: 12.5px">https://sub.tianjiyun.org/api/v1/client/subscribe?token=••••••••<span style="color: #0842C2; font-family: 'Noto Sans SC'">显示</span></span><span class="lbl">链接含个人令牌，导出诊断报告时会自动隐藏</span></label>
          <div style="display: flex; gap: 14px">
            <label class="f" style="flex: 1"><span class="fl">自动更新</span><span class="in">每 6 小时<span aria-hidden="true">▾</span></span></label>
            <label class="f" style="flex: 1"><span class="fl">User-Agent</span><span class="in">默认（FlClash 兼容）<span aria-hidden="true">▾</span></span></label>
          </div>
          <div>
            <div class="set"><div style="flex: 1"><div style="font-size: 14px">在仪表盘显示套餐信息</div><div class="lbl">剩余天数、流量与续费入口</div></div><button class="tg on" aria-pressed="true" aria-label="在仪表盘显示套餐信息"></button></div>
            <div class="set"><div style="flex: 1"><div style="font-size: 14px">到期与流量提醒</div><div class="lbl">剩余 7 天或流量用完 90% 时提醒</div></div><button class="tg on" aria-pressed="true" aria-label="到期与流量提醒"></button></div>
            <div class="set"><div style="flex: 1"><div style="font-size: 14px">扩展覆写与脚本</div><div class="lbl">已启用 1 项覆写</div></div><a class="btn" href="Extend.html">管理</a></div>
            <div class="set"><div style="flex: 1"><div style="font-size: 14px">查看原始配置</div><div class="lbl">只读预览，修改请用自定义配置</div></div><a class="btn" href="ProfileEditor.html">打开</a></div>
          </div>
        </section>
        <div style="width: 340px; flex: none; display: flex; flex-direction: column; gap: 14px">
          <section class="card" style="padding: 20px 22px; display: flex; flex-direction: column; gap: 10px" aria-label="套餐">
            <div style="font-size: 14px; font-weight: 700">套餐信息</div>
            <div style="display: flex; justify-content: space-between; font-size: 13px"><span class="lbl">套餐</span><span>AI 住宅原生 IP</span></div>
            <div style="display: flex; justify-content: space-between; font-size: 13px"><span class="lbl">到期</span><span>2026-12-06（剩余 28 天）</span></div>
            <div style="display: flex; justify-content: space-between; font-size: 13px"><span class="lbl">流量</span><span class="mono">10.2 / 200 GB</span></div>
            <div style="display: flex; justify-content: space-between; font-size: 13px"><span class="lbl">线路</span><span>47 条 · 12 个分组</span></div>
            <div style="display: flex; justify-content: space-between; font-size: 13px"><span class="lbl">上次更新</span><span>19 分钟前 · 成功</span></div>
            <button class="btn pri" style="margin-top: 6px">续费 / 升级</button>
          </section>
          <section class="card" style="padding: 20px 22px; display: flex; flex-direction: column; gap: 10px" aria-label="危险操作">
            <div style="font-size: 14px; font-weight: 700">删除订阅</div>
            <div class="lbl" style="line-height: 1.6">只删除本机的配置，不影响你的天机云账号和套餐。</div>
            <button class="btn" style="color: #B42335; border-color: #F1C4CC">删除此订阅</button>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
