<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天机云 Windows 线路</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.window{width:1280px;height:800px;background:#EEF1F4;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;border:1px solid #C3CAD3;font-family:'Noto Sans SC',system-ui,sans-serif;color:#0E1726}
.titlebar{height:32px;flex:none;display:flex;align-items:center;justify-content:space-between;padding-left:12px;background:#F7F8FA;border-bottom:1px solid #DCE1E7;font-size:12px;color:#4A5568}
.wc{display:flex}.wc span{width:46px;height:32px;display:grid;place-items:center;color:#2D3748}
.body{flex:1;display:flex;min-height:0}
.rail{width:220px;flex:none;background:#F7F8FA;border-right:1px solid #DCE1E7;padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.mark{width:32px;height:32px;border-radius:9px;background:#0E1726;display:grid;place-items:center;flex:none}
.nav{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:9px;color:#4A5568;text-decoration:none;font-size:14px}
.nav:hover{background:#EBEEF2;color:#0E1726}
.nav.on{background:#fff;color:#0E1726;font-weight:600;box-shadow:inset 0 0 0 1px #DCE1E7}
.nav.on svg{color:#0A55F5}
.main{flex:1;min-width:0;padding:20px 28px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;height:34px}
h1{margin:0;font-size:22px;font-weight:700}
.card{background:#fff;border:1px solid #DCE1E7;border-radius:14px}
.lbl{font-size:12px;color:#56616F}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 12px;border-radius:14px;font-size:12px;background:#fff;border:1px solid #DCE1E7;color:#4A5568;white-space:nowrap}
.pill.ok{background:#E7F5EF;border-color:#BFE3D2;color:#0B6E4B}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:12px;background:#EEF1F4;color:#2D3748;white-space:nowrap}
.chip.blue{background:#E6EEFE;color:#0842C2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:9px;border:1px solid #DCE1E7;background:#fff;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none;color:#0E1726;white-space:nowrap}
.btn.pri{background:#0A55F5;border-color:#0A55F5;color:#fff}
.grp{display:flex;align-items:center;justify-content:space-between;gap:8px;height:44px;padding:0 12px;border-radius:10px;border:0;background:transparent;width:100%;text-align:left;cursor:pointer;font-size:14px;color:#2D3748}
.grp.on{background:#fff;box-shadow:inset 0 0 0 1px #DCE1E7;font-weight:600;color:#0E1726}
.node{border:1px solid #DCE1E7;background:#fff;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;width:100%}
.node.sel{border-color:#0A55F5;box-shadow:0 0 0 3px #E6EEFE}
.cc{width:30px;height:20px;border-radius:4px;background:#0E1726;color:#fff;font-size:10px;display:grid;place-items:center;flex:none}
.ok-t{color:#0B6E4B}.warn-t{color:#A15C00}.bad-t{color:#B42335}
</style>
<!-- 精致化层（Apple 质感），必须在各页基础样式之后加载 -->
<link rel="stylesheet" href="../assets/polish.css">
<style>html{background:#D9DEE5}body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px}.__back{position:fixed;left:12px;top:10px;font:12px system-ui;color:#56616F;text-decoration:none;z-index:9999}</style>
</head>
<body>
<a class="__back" href="../index.html">← 全部页面</a>
<!-- 画板尺寸: 1280×800 -->
<div class="window">
  <div class="titlebar">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#0E1726"></rect><circle cx="12" cy="12" r="6" fill="none" stroke="#fff" stroke-width="2"></circle><circle cx="16.5" cy="7.5" r="2.2" fill="#5B8CFF"></circle></svg>
      <span>天机云</span>
    </div>
    <div class="wc" aria-hidden="true">
      <span><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"></path></svg></span>
      <span><svg width="10" height="10" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"></rect></svg></span>
      <span><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"></path></svg></span>
    </div>
  </div>
  <div class="body">
    <nav class="rail" aria-label="主导航">
      <div class="brand">
        <div class="mark"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6.5" fill="none" stroke="#fff" stroke-width="1.8"></circle><circle cx="16.8" cy="7.2" r="2.4" fill="#5B8CFF"></circle></svg></div>
        <div><div style="font-size: 16px; font-weight: 700; line-height: 1.1">天机云</div><div style="font-size: 10px; letter-spacing: .16em; color: #56616F; margin-top: 3px">TIANJI CLOUD</div></div>
      </div>
      <a class="nav" href="../Main.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>仪表盘</a>
      <a class="nav on" href="Proxies.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg>线路</a>
      <a class="nav" href="Profiles.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5M10 13h6M10 17h6"></path></svg>订阅</a>
      <a class="nav" href="Requests.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 4v16M4 17l3 3 3-3M17 20V4M14 7l3-3 3 3"></path></svg>连接</a>
      <a class="nav" href="Logs.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>日志与诊断</a>
      <a class="nav" href="Settings.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>设置</a>
      <div class="card" style="margin-top: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px">
        <div style="font-size: 13px; font-weight: 600">AI 住宅原生 IP</div>
        <div class="lbl">剩余 28 天 · 已用 5%</div>
        <div style="height: 8px; border-radius: 4px; background: #EEF1F4; overflow: hidden"><div style="width: 5%; height: 8px; background: #0A55F5"></div></div>
      </div>
    </nav>
    <main class="main">
      <div class="top">
        <h1>线路</h1>
        <div style="display: flex; align-items: center; gap: 8px">
          <label style="display: flex; align-items: center; gap: 8px; height: 34px; width: 240px; padding: 0 12px; border: 1px solid #DCE1E7; border-radius: 9px; background: #fff">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#56616F" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
            <input type="search" placeholder="搜索线路名或地区" aria-label="搜索线路" style="border: 0; outline: none; font: inherit; font-size: 13px; width: 100%; background: transparent">
          </label>
          <button class="btn">按延迟排序</button>
          <button class="btn pri">全部测速</button>
        </div>
      </div>

      <div class="card" style="padding: 12px 16px; display: flex; align-items: center; gap: 12px; background: #F4F8FF; border-color: #C9D9FB">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A55F5" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16.5v.5"></path></svg>
        <span style="font-size: 13px; color: #1E2A3B">手动选择优先：选中哪条，出口就是哪条。切换后会自动校验出口 IP，不一致会直接写明原因。</span>
      </div>

      <div style="flex: 1; min-height: 0; display: flex; gap: 14px">
        <div class="card" style="width: 232px; flex: none; padding: 10px; display: flex; flex-direction: column; gap: 2px; background: #F7F8FA">
          <div class="lbl" style="padding: 6px 12px">分组</div>
          <button class="grp on"><span>AI 专线</span><span class="lbl">6</span></button>
          <button class="grp"><span>家宽 · 住宅</span><span class="chip blue">锁定</span></button>
          <button class="grp"><span>香港</span><span class="lbl">8</span></button>
          <button class="grp"><span>日本</span><span class="lbl">7</span></button>
          <button class="grp"><span>新加坡</span><span class="lbl">5</span></button>
          <button class="grp"><span>美国</span><span class="lbl">9</span></button>
          <button class="grp"><span>大带宽 · 流媒体</span><span class="lbl">4</span></button>
          <button class="grp"><span>自动选择</span><span class="lbl">全部</span></button>
          <div style="margin-top: auto; padding: 12px; font-size: 12px; line-height: 1.6; color: #56616F">家宽分组已锁定到「东京家宽 · 04」，在家宽线路里更换。</div>
        </div>

        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: baseline; gap: 10px">
            <span style="font-size: 16px; font-weight: 600">AI 专线</span>
            <span class="lbl">当前：美国 · 洛杉矶 住宅 02 · 出口已校验</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
            <button class="node sel">
              <div style="display: flex; align-items: center; gap: 10px"><span class="mono cc">US</span><span style="font-size: 14px; font-weight: 600">洛杉矶 住宅 02</span><span style="flex: 1"></span><span class="mono ok-t" style="font-size: 15px; font-weight: 600">142 ms</span></div>
              <div style="display: flex; gap: 6px"><span class="chip blue">住宅原生</span><span class="chip">AT&amp;T</span><span class="chip">倍率 1.5×</span></div>
            </button>
            <button class="node">
              <div style="display: flex; align-items: center; gap: 10px"><span class="mono cc">US</span><span style="font-size: 14px; font-weight: 600">洛杉矶 住宅 01</span><span style="flex: 1"></span><span class="mono warn-t" style="font-size: 15px; font-weight: 600">168 ms</span></div>
              <div style="display: flex; gap: 6px"><span class="chip blue">住宅原生</span><span class="chip">Verizon</span><span class="chip">倍率 1.5×</span></div>
            </button>
            <button class="node">
              <div style="display: flex; align-items: center; gap: 10px"><span class="mono cc">US</span><span style="font-size: 14px; font-weight: 600">圣何塞 住宅 01</span><span style="flex: 1"></span><span class="mono warn-t" style="font-size: 15px; font-weight: 600">171 ms</span></div>
              <div style="display: flex; gap: 6px"><span class="chip blue">住宅原生</span><span class="chip">AT&amp;T</span><span class="chip">倍率 1.5×</span></div>
            </button>
            <button class="node">
              <div style="display: flex; align-items: center; gap: 10px"><span class="mono cc">JP</span><span style="font-size: 14px; font-weight: 600">东京 住宅 03</span><span style="flex: 1"></span><span class="mono ok-t" style="font-size: 15px; font-weight: 600">48 ms</span></div>
              <div style="display: flex; gap: 6px"><span class="chip blue">住宅原生</span><span class="chip">SoftBank</span><span class="chip">倍率 1.5×</span></div>
            </button>
            <button class="node">
              <div style="display: flex; align-items: center; gap: 10px"><span class="mono cc">SG</span><span style="font-size: 14px; font-weight: 600">新加坡 AI 01</span><span style="flex: 1"></span><span class="mono ok-t" style="font-size: 15px; font-weight: 600">79 ms</span></div>
              <div style="display: flex; gap: 6px"><span class="chip">机房</span><span class="chip">倍率 1.0×</span></div>
            </button>
            <button class="node">
              <div style="display: flex; align-items: center; gap: 10px"><span class="mono cc">US</span><span style="font-size: 14px; font-weight: 600">西雅图 AI 01</span><span style="flex: 1"></span><span class="mono bad-t" style="font-size: 15px; font-weight: 600">超时</span></div>
              <div style="display: flex; gap: 6px"><span class="chip">机房</span><span class="chip">倍率 1.0×</span></div>
            </button>
          </div>

          <div class="card" style="margin-top: auto; padding: 16px 18px; display: flex; align-items: center; gap: 16px">
            <div style="width: 36px; height: 36px; border-radius: 10px; background: #E7F5EF; display: grid; place-items: center; flex: none">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B6E4B" stroke-width="2" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
            </div>
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 14px; font-weight: 600">出口校验通过</div>
              <div class="lbl" style="margin-top: 3px">所选「洛杉矶 住宅 02」与实际出口 <span class="mono">203.0.113.88</span> 一致 · 14:22 检测</div>
            </div>
            <button class="btn">重新校验</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>
</body>
</html>
