<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天机云 设置 外观</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}button,input{font:inherit;color:inherit}
.w{width:1280px;height:800px;background:#EEF1F4;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;border:1px solid #C3CAD3;font-family:'Noto Sans SC',system-ui,sans-serif;color:#0E1726}
.tb{height:32px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 12px;background:#F7F8FA;border-bottom:1px solid #DCE1E7;font-size:12px;color:#4A5568}
.bd{flex:1;display:flex;min-height:0}
.ir{width:64px;flex:none;background:#F7F8FA;border-right:1px solid #DCE1E7;padding:14px 10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.ia{width:44px;height:40px;border-radius:10px;display:grid;place-items:center;color:#4A5568}
.ia.on{background:#fff;color:#0A55F5;box-shadow:inset 0 0 0 1px #DCE1E7}
.sn{width:210px;flex:none;padding:18px 10px;display:flex;flex-direction:column;gap:1px;border-right:1px solid #DCE1E7;background:#F2F4F7}
.sub{display:flex;align-items:center;height:32px;padding:0 12px;border-radius:8px;font-size:13.5px;color:#4A5568;text-decoration:none}
.sub.on{background:#fff;color:#0E1726;font-weight:600;box-shadow:inset 0 0 0 1px #DCE1E7}
.sep{font-size:11px;letter-spacing:.08em;color:#56616F;padding:10px 12px 3px}
.pn{flex:1;min-width:0;padding:22px 28px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
h1{margin:0;font-size:22px;font-weight:700}
.card{background:#fff;border:1px solid #DCE1E7;border-radius:14px}
.h2{font-size:15px;font-weight:700;padding:16px 20px 6px;margin:0}
.set{display:flex;align-items:center;gap:16px;padding:13px 20px;border-top:1px solid #EEF1F4}
.lbl{font-size:12px;color:#56616F}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.tg{width:40px;height:24px;border-radius:12px;background:#B8C1CC;border:0;position:relative;flex:none;padding:0}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg.on{background:#0A55F5}.tg.on::after{left:19px}
.sel{height:34px;min-width:160px;padding:0 12px;border:1px solid #DCE1E7;border-radius:9px;background:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:space-between;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:9px;border:1px solid #DCE1E7;background:#fff;font-size:13px;font-weight:500;color:#0E1726;white-space:nowrap}
.btn.pri{background:#0A55F5;border-color:#0A55F5;color:#fff}
.theme{width:160px;border:1px solid #DCE1E7;border-radius:12px;padding:8px;background:#fff;text-align:left}
.theme.on{border-color:#0A55F5;box-shadow:0 0 0 3px #E6EEFE}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #DCE1E7}
.sw.on{box-shadow:0 0 0 2px #0E1726}
</style>
<!-- 精致化层（Apple 质感），必须在各页基础样式之后加载 -->
<link rel="stylesheet" href="../assets/polish.css">
<style>html{background:#D9DEE5}body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px}.__back{position:fixed;left:12px;top:10px;font:12px system-ui;color:#56616F;text-decoration:none;z-index:9999}</style>
</head>
<body>

<div class="w">
  <div class="tb"><span>天机云</span><span style="letter-spacing: 22px">—▢✕</span></div>
  <div class="bd">
    <nav class="ir" aria-label="主导航">
      <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true" style="margin-bottom: 12px"><rect width="24" height="24" rx="6" fill="#0E1726"></rect><circle cx="12" cy="12" r="6" fill="none" stroke="#fff" stroke-width="1.8"></circle><circle cx="16.5" cy="7.5" r="2.2" fill="#5B8CFF"></circle></svg>
      <a class="ia" href="../Main.html" aria-label="仪表盘"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg></a>
      <a class="ia" href="Proxies.html" aria-label="线路"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg></a>
      <a class="ia" href="Profiles.html" aria-label="订阅"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5M10 13h6M10 17h6"></path></svg></a>
      <a class="ia" href="Requests.html" aria-label="连接"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 4v16M4 17l3 3 3-3M17 20V4M14 7l3-3 3 3"></path></svg></a>
      <a class="ia" href="Logs.html" aria-label="日志与诊断"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"></path></svg></a>
      <a class="ia on" href="Settings.html" aria-label="设置"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></a>
    </nav>
    <nav class="sn" aria-label="设置目录">
      <div class="sep">常用</div>
      <a class="sub" href="Settings.html">常规</a>
      <a class="sub on" href="SetTheme.html">外观</a>
      <a class="sub" href="SetHotkey.html">快捷键</a>

      <a class="sub" href="SetIcons.html">图标与 UA</a>
      <div class="sep">其他</div>
      <a class="sub" href="ServiceManage.html">系统服务</a>
      <a class="sub" href="SetDeveloper.html">开发者选项</a>
      <a class="sub" href="About.html">关于天机云</a>
    </nav>
    <main class="pn">
      <h1>外观</h1>
      <section class="card" aria-label="主题">
        <div class="h2">主题</div>
        <div style="display: flex; gap: 12px; padding: 8px 20px 18px">
          <button class="theme on"><div style="height: 70px; border-radius: 8px; background: #EEF1F4; border: 1px solid #DCE1E7; display: flex; gap: 4px; padding: 6px"><div style="width: 22px; border-radius: 4px; background: #F7F8FA"></div><div style="flex: 1; border-radius: 4px; background: #fff"></div></div><div style="font-size: 13px; font-weight: 600; margin-top: 8px">浅色</div></button>
          <button class="theme"><div style="height: 70px; border-radius: 8px; background: #0B0F14; display: flex; gap: 4px; padding: 6px"><div style="width: 22px; border-radius: 4px; background: #131A22"></div><div style="flex: 1; border-radius: 4px; background: #1A2330"></div></div><div style="font-size: 13px; margin-top: 8px">深色</div></button>
          <button class="theme"><div style="height: 70px; border-radius: 8px; background: linear-gradient(90deg, #EEF1F4 50%, #0B0F14 50%); border: 1px solid #DCE1E7"></div><div style="font-size: 13px; margin-top: 8px">跟随系统</div></button>
        </div>
      </section>
      <section class="card" aria-label="强调色">
        <div class="h2">强调色</div>
        <div style="display: flex; align-items: center; gap: 14px; padding: 8px 20px 18px">
          <span class="sw on" style="background: #0A55F5" aria-label="天机蓝（默认）"></span>
          <span class="sw" style="background: #0E8A5F" aria-label="青绿"></span>
          <span class="sw" style="background: #6A4BD8" aria-label="紫"></span>
          <span class="sw" style="background: #C2410C" aria-label="橙"></span>
          <span class="sw" style="background: #2D3748" aria-label="石墨"></span>
          <span class="lbl" style="margin-left: 8px">天机蓝（默认）· 状态色不随强调色变化</span>
        </div>
      </section>
      <section class="card" aria-label="文字与布局">
        <div class="h2">文字与布局</div>
        <div class="set"><div style="flex: 1"><div style="font-size: 14px">界面字体</div><div class="lbl">数字与 IP 始终使用等宽字体</div></div><span class="sel">系统默认<span aria-hidden="true">▾</span></span></div>
        <div class="set"><div style="flex: 1"><div style="font-size: 14px">文字大小</div></div><div style="display: flex; align-items: center; gap: 10px; width: 260px"><span class="lbl">A</span><div style="flex: 1; height: 4px; border-radius: 2px; background: #DCE1E7; position: relative"><div style="width: 40%; height: 4px; border-radius: 2px; background: #0A55F5"></div><span style="position: absolute; left: 40%; top: -7px; width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid #0A55F5; margin-left: -9px"></span></div><span style="font-size: 18px">A</span></div></div>
        <div class="set"><div style="flex: 1"><div style="font-size: 14px">线路卡片密度</div></div><span class="sel">标准<span aria-hidden="true">▾</span></span></div>
        <div class="set"><div style="flex: 1"><div style="font-size: 14px">线路图标</div><div class="lbl">地区代码块 / 简洁 / 隐藏</div></div><span class="sel">地区代码块<span aria-hidden="true">▾</span></span></div>
        <div class="set"><div style="flex: 1"><div style="font-size: 14px">减少动效</div><div class="lbl">关闭刻度环旋转等动画</div></div><button class="tg" aria-pressed="false" aria-label="减少动效"></button></div>
      </section>
    </main>
  </div>
</div>
