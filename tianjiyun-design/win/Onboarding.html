<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天机云 首次导入</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.window{width:1280px;height:800px;background:#EEF1F4;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;border:1px solid #C3CAD3;font-family:'Noto Sans SC',system-ui,sans-serif;color:#0E1726}
.titlebar{height:32px;flex:none;display:flex;align-items:center;justify-content:space-between;padding-left:12px;background:#F7F8FA;border-bottom:1px solid #DCE1E7;font-size:12px;color:#4A5568}
.wc{display:flex}.wc span{width:46px;height:32px;display:grid;place-items:center;color:#2D3748}
.lbl{font-size:12px;color:#56616F}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 18px;border-radius:10px;border:1px solid #DCE1E7;background:#fff;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;color:#0E1726;white-space:nowrap}
.btn.pri{background:#0A55F5;border-color:#0A55F5;color:#fff}
.step{display:flex;align-items:center;gap:10px;font-size:13px;color:#56616F}
.num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:1.5px solid #B8C1CC;flex:none}
.step.done .num{background:#0E8A5F;border-color:#0E8A5F;color:#fff}
.step.cur{color:#0E1726;font-weight:600}
.step.cur .num{border-color:#0A55F5;color:#0A55F5;box-shadow:0 0 0 4px #E6EEFE}
.chk{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #EEF1F4;font-size:14px}
</style>
<!-- 精致化层（Apple 质感），必须在各页基础样式之后加载 -->
<link rel="stylesheet" href="../assets/polish.css">
<style>html{background:#D9DEE5}body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px}.__back{position:fixed;left:12px;top:10px;font:12px system-ui;color:#56616F;text-decoration:none;z-index:9999}</style>
</head>
<body>
<a class="__back" href="../index.html">← 全部页面</a>
<!-- 画板尺寸: 1280×800 -->
<div class="window">
  <div class="titlebar">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#0E1726"></rect><circle cx="12" cy="12" r="6" fill="none" stroke="#fff" stroke-width="2"></circle><circle cx="16.5" cy="7.5" r="2.2" fill="#5B8CFF"></circle></svg>
      <span>天机云</span>
    </div>
    <div class="wc" aria-hidden="true">
      <span><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor"></path></svg></span>
      <span><svg width="10" height="10" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor"></rect></svg></span>
      <span><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor"></path></svg></span>
    </div>
  </div>
  <div style="flex: 1; display: flex; min-height: 0">
    <div style="width: 460px; flex: none; background: #0E1726; color: #fff; padding: 48px 44px; display: flex; flex-direction: column; position: relative; overflow: hidden">
      <div style="position: absolute; right: -120px; bottom: -120px; width: 380px; height: 380px; border-radius: 50%; border: 1px solid rgba(255,255,255,.12)"></div>
      <div style="position: absolute; right: -60px; bottom: -60px; width: 260px; height: 260px; border-radius: 50%; border: 1px solid rgba(255,255,255,.16)"></div>
      <div style="position: absolute; right: 120px; bottom: 170px; width: 14px; height: 14px; border-radius: 50%; background: #5B8CFF"></div>
      <div style="display: flex; align-items: center; gap: 12px">
        <svg width="40" height="40" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#1C2738"></rect><circle cx="12" cy="12" r="6.5" fill="none" stroke="#fff" stroke-width="1.6"></circle><circle cx="16.8" cy="7.2" r="2.4" fill="#5B8CFF"></circle></svg>
        <div><div style="font-size: 20px; font-weight: 700">天机云</div><div style="font-size: 11px; letter-spacing: .18em; color: #A8B3C2">TIANJI CLOUD</div></div>
      </div>
      <h1 style="margin: 72px 0 0; font-size: 34px; line-height: 1.3; font-weight: 700">三步连上<br>全球 AI 智能专网</h1>
      <p style="margin: 16px 0 0; font-size: 15px; line-height: 1.7; color: #C3CCD8">导入你在用户面板复制的订阅链接，客户端会自动校验、选好线路并连接。</p>
      <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; font-size: 13px; color: #A8B3C2">
        <span>还没有订阅？在 tianjiyun.org 购买后约 30 秒自动交付</span>
      </div>
    </div>
    <div style="flex: 1; padding: 48px 64px; display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; align-items: center; gap: 14px">
        <div class="step done"><span class="num">✓</span>粘贴订阅</div>
        <div style="flex: 1; height: 1px; background: #C9D0D8; max-width: 60px"></div>
        <div class="step cur"><span class="num">2</span>校验</div>
        <div style="flex: 1; height: 1px; background: #C9D0D8; max-width: 60px"></div>
        <div class="step"><span class="num">3</span>连接</div>
      </div>
      <div style="background: #fff; border: 1px solid #DCE1E7; border-radius: 16px; padding: 26px 28px; display: flex; flex-direction: column; gap: 16px">
        <label style="display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 14px; font-weight: 600">订阅链接</span>
          <input class="mono" value="https://sub.tianjiyun.org/api/v1/client/subscribe?token=••••••••" readonly style="height: 44px; padding: 0 14px; border: 1px solid #0A55F5; border-radius: 10px; font-size: 13px; color: #2D3748; outline: none; box-shadow: 0 0 0 3px #E6EEFE">
        </label>
        <div>
          <div class="chk"><span style="width: 22px; height: 22px; border-radius: 50%; background: #E7F5EF; color: #0B6E4B; display: grid; place-items: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="flex: 1">链接格式正确，属于天机云订阅</span></div>
          <div class="chk"><span style="width: 22px; height: 22px; border-radius: 50%; background: #E7F5EF; color: #0B6E4B; display: grid; place-items: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="flex: 1">已下载：AI 住宅原生 IP · 47 条线路</span><span class="lbl">剩余 28 天</span></div>
          <div class="chk"><span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #0A55F5; border-right-color: transparent"></span><span style="flex: 1; font-weight: 600">正在测试线路可用性…</span><span class="lbl mono">18 / 47</span></div>
          <div class="chk" style="color: #8A94A3"><span style="width: 22px; height: 22px; border-radius: 50%; border: 1.5px dashed #B8C1CC"></span><span style="flex: 1">检查本机网络能否访问外网</span></div>
        </div>
      </div>
      <div style="background: #FFF8EC; border: 1px solid #F3D9A8; border-radius: 12px; padding: 14px 16px; font-size: 13px; line-height: 1.6; color: #5C3A00">
        如果校验失败，会直接告诉你原因（链接过期、不是订阅链接、网络无法访问），并保留你之前的配置，不会把客户端弄坏。
      </div>
      <div style="display: flex; gap: 10px; margin-top: auto">
        <button class="btn">返回修改链接</button>
        <span style="flex: 1"></span>
        <button class="btn">稍后再说</button>
        <button class="btn pri" disabled style="opacity: .55">校验完成后连接</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
