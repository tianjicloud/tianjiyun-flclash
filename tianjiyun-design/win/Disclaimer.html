<body>
<a class="__back" href="../index.html">← 全部页面</a>
<!-- 画板尺寸: 1280×800 -->
<div style="width: 1280px; height: 800px; background: #EEF1F4; border-radius: 8px; border: 1px solid #C3CAD3; overflow: hidden; display: flex; flex-direction: column; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #0E1726">
  <div style="height: 32px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 18px 0 12px; background: #F7F8FA; border-bottom: 1px solid #DCE1E7; font-size: 12px; color: #4A5568"><span>天机云</span><span style="letter-spacing: 22px">—▢✕</span></div>
  <div style="flex: 1; display: grid; place-items: center">
    <div role="dialog" aria-label="使用前请阅读" style="width: 620px; background: #fff; border: 1px solid #DCE1E7; border-radius: 20px; padding: 32px 36px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 20px 50px rgba(14,23,38,.12)">
      <div style="display: flex; align-items: center; gap: 14px">
        <svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#0E1726"></rect><circle cx="12" cy="12" r="6.5" fill="none" stroke="#fff" stroke-width="1.6"></circle><circle cx="16.8" cy="7.2" r="2.4" fill="#5B8CFF"></circle></svg>
        <div><div style="font-size: 22px; font-weight: 700">使用前请阅读</div><div style="font-size: 12px; color: #56616F">首次启动时显示一次</div></div>
      </div>
      <div style="height: 300px; overflow: hidden; padding: 18px 20px; border-radius: 12px; background: #F7F8FA; font-size: 14px; line-height: 1.8; color: #2D3748">
        <p>天机云客户端用于连接你在 tianjiyun.org 购买的网络服务，基于开源项目 FlClash 修改。</p>
        <p>1. 请遵守你所在地以及服务器所在地的法律法规，不得用于任何违法用途。</p>
        <p>2. 客户端会在本机运行网络内核、修改系统代理或创建虚拟网卡；断开或退出时会自动恢复。</p>
        <p>3. 客户端不上传你的浏览记录。诊断报告仅在你主动导出时生成，且会去除订阅令牌、密码与原始 IP。</p>
        <p>4. 线路可用性受网络环境影响，检测结果会如实显示，失败即显示失败。</p>
      </div>
      <label style="display: flex; align-items: center; gap: 10px; font-size: 14px"><span style="width: 20px; height: 20px; border-radius: 5px; background: #0A55F5; color: #fff; display: grid; place-items: center; font-size: 12px">✓</span>我已阅读并同意上述内容与服务条款</label>
      <div style="display: flex; gap: 10px; justify-content: flex-end"><button class="btn">退出</button><a class="btn pri" href="Onboarding.html" style="text-decoration: none">同意并继续</a></div>
    </div>
  </div>
