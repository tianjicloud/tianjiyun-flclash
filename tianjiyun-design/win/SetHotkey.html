<style>
body{margin:0}*{box-sizing:border-box}button,input{font:inherit;color:inherit}
.w{width:1280px;height:800px;background:#EEF1F4;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;border:1px solid #C3CAD3;font-family:'Noto Sans SC',system-ui,sans-serif;color:#0E1726}
.tb{height:32px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 12px;background:#F7F8FA;border-bottom:1px solid #DCE1E7;font-size:12px;color:#4A5568}
.bd{flex:1;display:flex;min-height:0}
.ir{width:64px;flex:none;background:#F7F8FA;border-right:1px solid #DCE1E7;padding:14px 10px;display:flex;flex-direction:column;gap:6px;align-items:center}
.ia{width:44px;height:40px;border-radius:10px;display:grid;place-items:center;color:#4A5568}
.ia.on{background:#fff;color:#0A55F5;box-shadow:inset 0 0 0 1px #DCE1E7}
.sn{width:210px;flex:none;padding:18px 10px;display:flex;flex-direction:column;gap:1px;border-right:1px solid #DCE1E7;background:#F2F4F7}
.sub{display:flex;align-items:center;height:32px;padding:0 12px;border-radius:8px;font-size:13.5px;color:#4A5568;text-decoration:none}
.sub.on{background:#fff;color:#0E1726;font-weight:600;box-shadow:inset 0 0 0 1px #DCE1E7}
.sep{font-size:11px;letter-spacing:.08em;color:#56616F;padding:10px 12px 3px}
.pn{flex:1;min-width:0;padding:22px 28px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
h1{margin:0;font-size:22px;font-weight:700}
.card{background:#fff;border:1px solid #DCE1E7;border-radius:14px}
.set{display:flex;align-items:center;gap:16px;padding:12px 20px;border-top:1px solid #EEF1F4}
.lbl{font-size:12px;color:#56616F}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:9px;border:1px solid #DCE1E7;background:#fff;font-size:13px;font-weight:500;color:#0E1726;white-space:nowrap}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:28px;padding:0 8px;border-radius:7px;border:1px solid #C9D0D8;border-bottom-width:2px;background:#F7F8FA;font-family:'JetBrains Mono',monospace;font-size:12px}
.rec{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:9px;border:1.5px solid #0A55F5;box-shadow:0 0 0 3px #E6EEFE;font-size:12px;color:#0842C2}
</style>
<!-- 精致化层（Apple 质感），必须在各页基础样式之后加载 -->

    <main class="pn">
      <div style="display: flex; align-items: center"><h1 style="flex: 1">快捷键</h1><button class="btn">恢复默认</button></div>
      <div class="lbl">全局快捷键在窗口隐藏时也有效；与其他软件冲突时会提示。</div>
      <section class="card" aria-label="快捷键列表">
        <div class="set" style="border-top: 0"><div style="flex: 1; font-size: 14px">连接 / 断开</div><span class="key">Ctrl</span><span class="key">Alt</span><span class="key">T</span><button class="btn" style="height: 30px">修改</button></div>
        <div class="set"><div style="flex: 1; font-size: 14px">显示 / 隐藏主窗口</div><span class="key">Ctrl</span><span class="key">Alt</span><span class="key">Space</span><button class="btn" style="height: 30px">修改</button></div>
        <div class="set" style="background: #F4F8FF"><div style="flex: 1; font-size: 14px">切换出站模式（规则 → 全局 → 直连）</div><span class="rec"><span style="width: 8px; height: 8px; border-radius: 50%; background: #B42335"></span>请按下新的组合键…</span><button class="btn" style="height: 30px">取消</button></div>
        <div class="set"><div style="flex: 1; font-size: 14px">开关系统代理</div><span class="key">Ctrl</span><span class="key">Alt</span><span class="key">P</span><button class="btn" style="height: 30px">修改</button></div>
        <div class="set"><div style="flex: 1; font-size: 14px">开关虚拟网卡</div><span class="lbl">未设置</span><button class="btn" style="height: 30px">设置</button></div>
        <div class="set"><div style="flex: 1; font-size: 14px">切换场景（日常 → AI → 观影）</div><span class="lbl">未设置</span><button class="btn" style="height: 30px">设置</button></div>
        <div class="set"><div style="flex: 1"><div style="font-size: 14px">一键诊断</div><div class="lbl" style="color: #A15C00">与「截图工具」冲突，已停用</div></div><span class="key" style="opacity: .5">Ctrl</span><span class="key" style="opacity: .5">Shift</span><span class="key" style="opacity: .5">D</span><button class="btn" style="height: 30px">修改</button></div>
