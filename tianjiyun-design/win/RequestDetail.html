<style>
body{margin:0}*{box-sizing:border-box}button{font:inherit;color:inherit}
.w{width:1280px;height:800px;background:#EEF1F4;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;border:1px solid #C3CAD3;font-family:'Noto Sans SC',system-ui,sans-serif;color:#0E1726;position:relative}
.tb{height:32px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 12px;background:#F7F8FA;border-bottom:1px solid #DCE1E7;font-size:12px;color:#4A5568}

.kv{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-top:1px solid #EEF1F4;font-size:13px}
.kv span:first-child{color:#56616F;flex:none}
.hop{display:flex;align-items:center;gap:12px;font-size:13px}
.hop i{width:12px;height:12px;border-radius:50%;border:2px solid #0A55F5;background:#fff;flex:none}
.line{width:2px;height:18px;background:#C9D9FB;margin-left:5px}
