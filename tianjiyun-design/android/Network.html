<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天机云 Android 进阶网络设置</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}button{font:inherit;color:inherit}
.h{font-size:12px;color:#56616F;padding:0 6px 6px;letter-spacing:.04em}
.grp{background:#fff;border:1px solid #DCE1E7;border-radius:16px;overflow:hidden}
.it{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;border-top:1px solid #EEF1F4;font-size:15px}
.it:first-child{border-top:0}
.d{font-size:12px;color:#56616F;margin-top:2px}
.v{margin-left:auto;font-size:13px;color:#56616F;white-space:nowrap}
.tg{width:44px;height:26px;border-radius:13px;background:#B8C1CC;border:0;position:relative;flex:none;padding:0;margin-left:auto}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.tg.on{background:#0A55F5}.tg.on::after{left:21px}
</style>
<!-- 精致化层（Apple 质感），必须在各页基础样式之后加载 -->
<link rel="stylesheet" href="../assets/polish.css">
<style>html{background:#D9DEE5}body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px}.__back{position:fixed;left:12px;top:10px;font:12px system-ui;color:#56616F;text-decoration:none;z-index:9999}</style>
</head>
<body>
<a class="__back" href="../index.html">← 全部页面</a>
<!-- 画板尺寸: 390×844 -->
<div style="width: 390px; height: 844px; background: #EEF1F4; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #0E1726; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 6px; padding: 14px 10px 8px">
    <a href="Tools.html" aria-label="返回" style="width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <span style="font-size: 19px; font-weight: 700">进阶网络设置</span>
  </div>
  <div style="flex: 1; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
    <div>
      <div class="h">VPN</div>
      <div class="grp">
        <div class="it"><div><div>网络栈</div><div class="d">混合兼容性最好</div></div><span class="v">混合 ›</span></div>
        <div class="it"><div><div>严格接管</div><div class="d">阻止 WebRTC、QUIC 绕过</div></div><button class="tg on" aria-pressed="true" aria-label="严格接管"></button></div>
        <div class="it"><div><div>DNS 劫持</div><div class="d">所有 DNS 交给天机云</div></div><button class="tg on" aria-pressed="true" aria-label="DNS 劫持"></button></div>
        <div class="it"><div><div>系统代理（HTTP）</div><div class="d">部分应用只认系统代理</div></div><button class="tg on" aria-pressed="true" aria-label="系统代理"></button></div>
      </div>
    </div>
    <div>
      <div class="h">DNS 与嗅探</div>
      <div class="grp">
        <div class="it"><div>解析模式</div><span class="v">fake-ip ›</span></div>
        <div class="it"><div><div>海外解析失败不回退本地</div></div><button class="tg on" aria-pressed="true" aria-label="不回退本地"></button></div>
        <div class="it"><div>域名嗅探</div><button class="tg on" aria-pressed="true" aria-label="域名嗅探"></button></div>
      </div>
    </div>
    <div>
      <div class="h">其他</div>
      <div class="grp">
        <div class="it"><div>按需连接</div><span class="v">Wi-Fi 规则 2 条 ›</span></div>
        <div class="it"><div>规则与覆写</div><span class="v">›</span></div>
        <div class="it"><div>MITM</div><span class="v">关闭 ›</span></div>
        <div class="it"><div>开发者选项</div><span class="v">›</span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
