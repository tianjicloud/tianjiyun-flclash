<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天机云 Android 扫码导入</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}button{font:inherit;color:inherit}
.cn{position:absolute;width:34px;height:34px;border-color:#fff;border-style:solid;border-width:0}
</style>
<!-- 精致化层（Apple 质感），必须在各页基础样式之后加载 -->
<link rel="stylesheet" href="../assets/polish.css">
<style>html{background:#D9DEE5}body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px}.__back{position:fixed;left:12px;top:10px;font:12px system-ui;color:#56616F;text-decoration:none;z-index:9999}</style>
</head>
<body>
<a class="__back" href="../index.html">← 全部页面</a>
<!-- 画板尺寸: 390×844 -->
<div style="width: 390px; height: 844px; background: #1B232D; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #fff; position: relative; overflow: hidden">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(circle at 50% 42%, #3A4656 0, #1B232D 60%)"></div>
  <div style="position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 8px; padding: 16px 12px">
    <a href="Profiles.html" aria-label="返回" style="width: 40px; height: 40px; border-radius: 20px; background: rgba(255,255,255,.12); display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <span style="font-size: 17px; font-weight: 700; flex: 1">扫码导入订阅</span>
    <button aria-label="打开闪光灯" style="width: 40px; height: 40px; border-radius: 20px; border: 0; background: rgba(255,255,255,.12); display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"></path></svg></button>
  </div>
  <div style="position: absolute; left: 55px; top: 230px; width: 280px; height: 280px">
    <span class="cn" style="left: 0; top: 0; border-left-width: 4px; border-top-width: 4px; border-top-left-radius: 14px"></span>
    <span class="cn" style="right: 0; top: 0; border-right-width: 4px; border-top-width: 4px; border-top-right-radius: 14px"></span>
    <span class="cn" style="left: 0; bottom: 0; border-left-width: 4px; border-bottom-width: 4px; border-bottom-left-radius: 14px"></span>
    <span class="cn" style="right: 0; bottom: 0; border-right-width: 4px; border-bottom-width: 4px; border-bottom-right-radius: 14px"></span>
    <div style="position: absolute; left: 18px; right: 18px; top: 46%; height: 2px; background: #5B8CFF; box-shadow: 0 0 14px #5B8CFF"></div>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 540px; text-align: center; font-size: 14px; color: #C9D2DD">把用户面板里的订阅二维码放进框内</div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 28px; display: flex; flex-direction: column; gap: 10px">
    <button style="height: 52px; border-radius: 14px; border: 0; background: rgba(255,255,255,.14); color: #fff; font-size: 15px; font-weight: 600">从相册选择二维码</button>
    <button style="height: 52px; border-radius: 14px; border: 0; background: rgba(255,255,255,.14); color: #fff; font-size: 15px; font-weight: 600">改为粘贴链接</button>
    <div style="text-align: center; font-size: 12px; color: #9AA6B4">扫码后会先校验，确认无误才会导入</div>
  </div>
</div>
</body>
</html>
