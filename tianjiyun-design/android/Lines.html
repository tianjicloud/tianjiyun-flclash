<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>天机云 Android 线路</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.phone{width:390px;height:844px;background:#EEF1F4;font-family:'Noto Sans SC',system-ui,sans-serif;color:#0E1726;display:flex;flex-direction:column;overflow:hidden;position:relative}
.lbl{font-size:12px;color:#56616F}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11px;background:#EEF1F4;color:#2D3748;white-space:nowrap}
.chip.blue{background:#E6EEFE;color:#0842C2}
.gt{height:34px;padding:0 14px;border-radius:17px;border:1px solid #DCE1E7;background:#fff;font-size:13px;white-space:nowrap;cursor:pointer;flex:none}
.gt.on{background:#0E1726;border-color:#0E1726;color:#fff;font-weight:600}
.row{display:flex;align-items:center;gap:12px;min-height:64px;padding:10px 16px;border-bottom:1px solid #EEF1F4;background:#fff;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer}
.cc{width:30px;height:20px;border-radius:4px;background:#0E1726;color:#fff;font-size:10px;display:grid;place-items:center;flex:none}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid #B8C1CC;flex:none}
.radio.on{border:6px solid #0A55F5}
.tabs{height:72px;flex:none;background:#fff;border-top:1px solid #DCE1E7;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:#56616F;text-decoration:none}
.tab .ic{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
.tab.on{color:#0E1726;font-weight:600}
.tab.on .ic{background:#E6EEFE;color:#0A55F5}
.ok-t{color:#0B6E4B}.warn-t{color:#A15C00}.bad-t{color:#B42335}
</style>
<!-- 精致化层（Apple 质感），必须在各页基础样式之后加载 -->
<link rel="stylesheet" href="../assets/polish.css">
<style>html{background:#D9DEE5}body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px}.__back{position:fixed;left:12px;top:10px;font:12px system-ui;color:#56616F;text-decoration:none;z-index:9999}</style>
</head>
