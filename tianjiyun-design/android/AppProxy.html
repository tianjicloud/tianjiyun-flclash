<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天机云 Android 分应用代理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.lbl{font-size:12px;color:#56616F}
.seg{display:flex;background:#E4E8ED;border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;height:36px;border-radius:10px;font-size:13px;color:#4A5568}
.seg button.on{background:#fff;color:#0E1726;font-weight:600;box-shadow:0 1px 2px rgba(14,23,38,.14)}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #EEF1F4;background:#fff;min-height:60px}
.app{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff;flex:none}
.cb{width:22px;height:22px;border-radius:6px;border:1.5px solid #B8C1CC;flex:none;display:grid;place-items:center;background:#fff}
.cb.on{background:#0A55F5;border-color:#0A55F5;color:#fff}
.sec{font-size:12px;color:#56616F;padding:12px 16px 6px;background:#EEF1F4}
</style>
<!-- 精致化层（Apple 质感），必须在各页基础样式之后加载 -->
<link rel="stylesheet" href="../assets/polish.css">
<style>html{background:#D9DEE5}body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px}.__back{position:fixed;left:12px;top:10px;font:12px system-ui;color:#56616F;text-decoration:none;z-index:9999}</style>
</head>
<body>
<a class="__back" href="../index.html">← 全部页面</a>
<!-- 画板尺寸: 390×844 -->
<div style="width: 390px; height: 844px; background: #EEF1F4; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #0E1726; display: flex; flex-direction: column; overflow: hidden; position: relative">
  <div style="display: flex; align-items: center; gap: 6px; padding: 14px 10px 8px">
    <a href="Tools.html" aria-label="返回" style="width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <span style="font-size: 19px; font-weight: 700">分应用代理</span>
    <span style="flex: 1"></span>
    <button aria-label="开启分应用代理" aria-pressed="true" style="width: 48px; height: 28px; border-radius: 14px; border: 0; background: #0A55F5; position: relative; padding: 0; margin-right: 6px"><span style="position: absolute; top: 3px; left: 23px; width: 22px; height: 22px; border-radius: 50%; background: #fff"></span></button>
  </div>
  <div style="padding: 0 16px 10px"><div class="seg" role="group" aria-label="规则"><button class="on">只代理勾选的应用</button><button>勾选的应用不走代理</button></div></div>
  <label style="margin: 0 16px 12px; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; border-radius: 12px; background: #fff; border: 1px solid #DCE1E7">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#56616F" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
    <input type="search" placeholder="搜索应用" aria-label="搜索应用" style="border: 0; outline: none; font: inherit; font-size: 14px; width: 100%; background: transparent">
  </label>
  <div style="flex: 1; min-height: 0; overflow: hidden; border-top: 1px solid #DCE1E7">
    <div class="sec">已勾选 · 12</div>
    <div class="row"><span class="app" style="background: #0F7B6C">G</span><div style="flex: 1"><div style="font-size: 15px">ChatGPT</div><div class="lbl">com.openai.chatgpt</div></div><span class="cb on"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></div>
    <div class="row"><span class="app" style="background: #C15F3C">C</span><div style="flex: 1"><div style="font-size: 15px">Claude</div><div class="lbl">com.anthropic.claude</div></div><span class="cb on"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></div>
    <div class="row"><span class="app" style="background: #4285F4">G</span><div style="flex: 1"><div style="font-size: 15px">Gemini</div><div class="lbl">com.google.android.apps.bard</div></div><span class="cb on"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></div>
    <div class="row"><span class="app" style="background: #C4302B">Y</span><div style="flex: 1"><div style="font-size: 15px">YouTube</div><div class="lbl">com.google.android.youtube</div></div><span class="cb on"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></div>
    <div class="row"><span class="app" style="background: #229ED9">T</span><div style="flex: 1"><div style="font-size: 15px">Telegram</div><div class="lbl">org.telegram.messenger</div></div><span class="cb on"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></div>
    <div class="sec">未勾选</div>
    <div class="row"><span class="app" style="background: #1AAD19">W</span><div style="flex: 1"><div style="font-size: 15px">微信</div><div class="lbl">com.tencent.mm</div></div><span class="cb"></span></div>
    <div class="row"><span class="app" style="background: #1677FF">A</span><div style="flex: 1"><div style="font-size: 15px">支付宝</div><div class="lbl">com.eg.android.AlipayGphone</div></div><span class="cb"></span></div>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 20px; padding: 12px 14px; border-radius: 14px; background: #0E1726; color: #fff; font-size: 13px; line-height: 1.6; display: flex; gap: 10px; align-items: center">
    <span style="flex: 1">改动会在下次连接时生效</span>
    <button style="height: 34px; padding: 0 14px; border-radius: 10px; border: 0; background: #5B8CFF; color: #0E1726; font-weight: 600">立即重连</button>
  </div>
</div>
</body>
</html>
