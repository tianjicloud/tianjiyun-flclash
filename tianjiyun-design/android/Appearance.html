<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天机云 Android 外观与语言</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}*{box-sizing:border-box}button{font:inherit;color:inherit}
.h{font-size:12px;color:#56616F;padding:0 6px 6px;letter-spacing:.04em}
.grp{background:#fff;border:1px solid #DCE1E7;border-radius:16px;overflow:hidden}
.it{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 16px;border-top:1px solid #EEF1F4;font-size:15px}
.it:first-child{border-top:0}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid #B8C1CC;margin-left:auto}
.radio.on{border:6px solid #0A55F5}
.th{flex:1;border:1px solid #DCE1E7;border-radius:14px;padding:8px;background:#fff;text-align:center;font-size:13px}
.th.on{border-color:#0A55F5;box-shadow:0 0 0 3px #E6EEFE;font-weight:600}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #DCE1E7}
.sw.on{box-shadow:0 0 0 2px #0E1726}
</style>
<!-- 精致化层（Apple 质感），必须在各页基础样式之后加载 -->
<link rel="stylesheet" href="../assets/polish.css">
<style>html{background:#D9DEE5}body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px}.__back{position:fixed;left:12px;top:10px;font:12px system-ui;color:#56616F;text-decoration:none;z-index:9999}</style>
</head>
<body>
<a class="__back" href="../index.html">← 全部页面</a>
<!-- 画板尺寸: 390×844 -->
<div style="width: 390px; height: 844px; background: #EEF1F4; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #0E1726; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 6px; padding: 14px 10px 8px">
    <a href="Tools.html" aria-label="返回" style="width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E1726" stroke-width="2" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <span style="font-size: 19px; font-weight: 700">外观与语言</span>
  </div>
  <div style="flex: 1; padding: 4px 16px 20px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div>
      <div class="h">主题</div>
      <div style="display: flex; gap: 10px">
        <button class="th"><div style="height: 70px; border-radius: 8px; background: #EEF1F4; border: 1px solid #DCE1E7; margin-bottom: 6px"></div>浅色</button>
        <button class="th"><div style="height: 70px; border-radius: 8px; background: #0B0F14; margin-bottom: 6px"></div>深色</button>
        <button class="th on"><div style="height: 70px; border-radius: 8px; background: linear-gradient(90deg, #EEF1F4 50%, #0B0F14 50%); border: 1px solid #DCE1E7; margin-bottom: 6px"></div>跟随系统</button>
      </div>
    </div>
    <div>
      <div class="h">强调色</div>
      <div class="grp" style="padding: 14px 16px; display: flex; gap: 14px; align-items: center">
        <span class="sw on" style="background: #0A55F5" aria-label="天机蓝"></span><span class="sw" style="background: #0E8A5F" aria-label="青绿"></span><span class="sw" style="background: #6A4BD8" aria-label="紫"></span><span class="sw" style="background: #C2410C" aria-label="橙"></span>
        <span style="margin-left: auto; font-size: 13px; color: #56616F">跟随壁纸取色</span>
        <span style="width: 44px; height: 26px; border-radius: 13px; background: #B8C1CC; position: relative"><span style="position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff"></span></span>
      </div>
    </div>
    <div>
      <div class="h">语言</div>
      <div class="grp">
        <div class="it">跟随系统<span class="radio"></span></div>
        <div class="it" style="font-weight: 600">简体中文<span class="radio on"></span></div>
        <div class="it">繁體中文<span class="radio"></span></div>
        <div class="it">English<span class="radio"></span></div>
        <div class="it">日本語<span class="radio"></span></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
