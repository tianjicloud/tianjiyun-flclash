<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天机云 Android 订阅</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.phone{width:390px;height:844px;background:#EEF1F4;font-family:'Noto Sans SC',system-ui,sans-serif;color:#0E1726;display:flex;flex-direction:column;overflow:hidden;position:relative}
.card{background:#fff;border:1px solid #DCE1E7;border-radius:16px}
.lbl{font-size:12px;color:#56616F}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11px;background:#EEF1F4;color:#2D3748;white-space:nowrap}
.chip.blue{background:#E6EEFE;color:#0842C2}
.chip.green{background:#E7F5EF;color:#0B6E4B}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 16px;border-radius:12px;border:1px solid #DCE1E7;background:#fff;font-size:14px;font-weight:600;cursor:pointer;color:#0E1726}
.btn.pri{background:#0A55F5;border-color:#0A55F5;color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid #EEF1F4}
.ico{width:38px;height:38px;border-radius:10px;background:#EEF1F4;display:grid;place-items:center;flex:none}
.tabs{height:72px;flex:none;background:#fff;border-top:1px solid #DCE1E7;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:#56616F;text-decoration:none}
.tab .ic{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
.tab.on{color:#0E1726;font-weight:600}
.tab.on .ic{background:#E6EEFE;color:#0A55F5}
</style>
<!-- 精致化层（Apple 质感），必须在各页基础样式之后加载 -->
<link rel="stylesheet" href="../assets/polish.css">
<style>html{background:#D9DEE5}body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px}.__back{position:fixed;left:12px;top:10px;font:12px system-ui;color:#56616F;text-decoration:none;z-index:9999}</style>
</head>
<body>
<a class="__back" href="../index.html">← 全部页面</a>
<!-- 画板尺寸: 390×844 -->
<div class="phone">
  <div style="flex: 1; min-height: 0; padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; height: 40px">
      <span style="font-size: 22px; font-weight: 700">订阅</span>
      <span style="flex: 1"></span>
      <a href="Onboarding.html" style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 18px; background: #0E1726; color: #fff; font-size: 13px; font-weight: 600; text-decoration: none">＋ 导入</a>
    </div>

    <section class="card" style="padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: inset 0 3px 0 #0A55F5" aria-label="当前订阅">
      <div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 17px; font-weight: 700; flex: 1">AI 住宅原生 IP</span><span class="chip green">使用中</span></div>
      <div style="display: flex; gap: 5px; flex-wrap: wrap"><span class="chip">200 GB/月</span><span class="chip">8 台设备</span><span class="chip">1000 Mbps</span><span class="chip blue">住宅出口</span></div>
      <div style="display: flex; gap: 12px">
        <div style="flex: 1"><div class="lbl">剩余</div><div style="font-size: 26px; font-weight: 700">28 天</div><div class="lbl">2026-12-06 到期</div></div>
        <div style="flex: 1"><div class="lbl">本期已用</div><div style="font-size: 26px; font-weight: 700"><span class="mono">10.2</span><span style="font-size: 13px; color: #56616F"> GB</span></div><div class="lbl">共 200 GB</div></div>
      </div>
      <div style="height: 6px; border-radius: 3px; background: #EEF1F4; overflow: hidden"><div style="width: 5%; height: 6px; background: #0A55F5"></div></div>
      <div class="lbl">19 分钟前更新 · 每 6 小时自动更新</div>
      <div style="display: flex; gap: 8px">
        <button class="btn" style="flex: 1">立即更新</button>
        <button class="btn pri" style="flex: 1">续费 / 升级</button>
      </div>
    </section>

    <section class="card" aria-label="其他配置">
      <div style="padding: 14px 16px 8px; font-size: 14px; font-weight: 700">其他配置</div>
      <div class="row">
        <div class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5568" stroke-width="1.7" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></div>
        <div style="flex: 1"><div style="font-size: 14px; font-weight: 600">个人畅享（旧）</div><div class="lbl">已过期 3 天</div></div>
        <span class="chip" style="background: #FDF1E3; color: #8A4B00">已过期</span>
      </div>
      <div class="row">
        <div class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5568" stroke-width="1.7" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></div>
        <div style="flex: 1"><div style="font-size: 14px; font-weight: 600">自定义 · 公司内网直连</div><div class="lbl">基于当前订阅 · 3 条覆写</div></div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A94A3" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </div>
    </section>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button class="card" style="padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A55F5" stroke-width="1.8" aria-hidden="true"><rect x="8" y="3" width="11" height="14" rx="2"></rect><path d="M5 7v12a2 2 0 0 0 2 2h9"></path></svg>剪贴板</button>
      <button class="card" style="padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A55F5" stroke-width="1.8" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M4 12h16"></path></svg>扫码</button>
      <button class="card" style="padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0A55F5" stroke-width="1.8" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5"></path></svg>本地文件</button>
    </div>
  </div>
  <nav class="tabs" aria-label="底部导航">
    <a class="tab" href="Home.html"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg></span>首页</a>
    <a class="tab" href="Lines.html"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg></span>线路</a>
    <a class="tab on" href="Profiles.html"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"></path><path d="M14 3v5h5M10 13h6M10 17h6"></path></svg></span>订阅</a>
    <a class="tab" href="Tools.html"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg></span>工具</a>
  </nav>
</div>
</body>
</html>
