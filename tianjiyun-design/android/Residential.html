<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天机云 Android 家宽选择</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.lbl{font-size:12px;color:#56616F}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:11px;background:#EEF1F4;color:#2D3748;white-space:nowrap}
.chip.blue{background:#E6EEFE;color:#0842C2}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid #DCE1E7;border-radius:14px;background:#fff;width:100%;text-align:left;cursor:pointer}
.opt.sel{border-color:#0A55F5;box-shadow:0 0 0 3px #E6EEFE}
.opt.lock{background:#F7F8FA;cursor:not-allowed}
.cc{width:30px;height:20px;border-radius:4px;background:#0E1726;color:#fff;font-size:10px;display:grid;place-items:center;flex:none}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid #B8C1CC;flex:none}
.radio.on{border:6px solid #0A55F5}
.ok-t{color:#0B6E4B}.warn-t{color:#A15C00}
</style>
<!-- 精致化层（Apple 质感），必须在各页基础样式之后加载 -->
<link rel="stylesheet" href="../assets/polish.css">
<style>html{background:#D9DEE5}body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px}.__back{position:fixed;left:12px;top:10px;font:12px system-ui;color:#56616F;text-decoration:none;z-index:9999}</style>
</head>
<body>
<a class="__back" href="../index.html">← 全部页面</a>
<!-- 画板尺寸: 390×844 -->
<div style="width: 390px; height: 844px; background: #EEF1F4; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #0E1726; position: relative; overflow: hidden">
  <div aria-hidden="true" style="padding: 18px 16px; display: flex; flex-direction: column; gap: 12px; opacity: .9">
    <div style="height: 40px; display: flex; align-items: center; gap: 10px"><div style="width: 32px; height: 32px; border-radius: 8px; background: #0E1726"></div><div style="width: 70px; height: 16px; border-radius: 4px; background: #C9D0D8"></div></div>
    <div style="height: 300px; border-radius: 16px; background: #fff"></div>
    <div style="height: 42px; border-radius: 12px; background: #E4E8ED"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(14,23,38,.45)"></div>
  <div role="dialog" aria-label="选择家宽出口" style="position: absolute; left: 0; right: 0; bottom: 0; height: 640px; background: #F7F8FA; border-radius: 24px 24px 0 0; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="width: 36px; height: 4px; border-radius: 2px; background: #B8C1CC; align-self: center"></div>
    <div style="display: flex; align-items: center; gap: 10px; padding-top: 4px">
      <div style="flex: 1"><div style="font-size: 19px; font-weight: 700">选择家宽出口</div><div class="lbl" style="margin-top: 2px">AI 与需要代理的分组会跟随所选线路</div></div>
      <button aria-label="关闭" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: #E4E8ED; display: grid; place-items: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2D3748" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <button class="opt sel" aria-pressed="true"><span class="mono cc">JP</span><div style="flex: 1"><div style="font-size: 15px; font-weight: 700">东京家宽 · 04</div><div style="display: flex; gap: 5px; margin-top: 4px"><span class="chip blue">独享</span><span class="chip">SoftBank</span></div></div><span class="mono ok-t" style="font-size: 13px; font-weight: 600">37 ms</span><span class="radio on"></span></button>
      <button class="opt" aria-pressed="false"><span class="mono cc">JP</span><div style="flex: 1"><div style="font-size: 15px; font-weight: 600">大阪家宽 · 02</div><div style="display: flex; gap: 5px; margin-top: 4px"><span class="chip">共享</span><span class="chip">NTT</span></div></div><span class="mono ok-t" style="font-size: 13px; font-weight: 600">44 ms</span><span class="radio"></span></button>
      <button class="opt" aria-pressed="false"><span class="mono cc">HK</span><div style="flex: 1"><div style="font-size: 15px; font-weight: 600">香港家宽 · 01</div><div style="display: flex; gap: 5px; margin-top: 4px"><span class="chip">共享</span><span class="chip">HKBN</span></div></div><span class="mono ok-t" style="font-size: 13px; font-weight: 600">42 ms</span><span class="radio"></span></button>
      <button class="opt" aria-pressed="false"><span class="mono cc">US</span><div style="flex: 1"><div style="font-size: 15px; font-weight: 600">洛杉矶住宅 · 02</div><div style="display: flex; gap: 5px; margin-top: 4px"><span class="chip blue">独享</span><span class="chip">AT&amp;T</span></div></div><span class="mono warn-t" style="font-size: 13px; font-weight: 600">142 ms</span><span class="radio"></span></button>
      <button class="opt lock" aria-disabled="true"><span class="mono cc" style="background: #8A94A3">GB</span><div style="flex: 1"><div style="font-size: 15px; font-weight: 600; color: #56616F">伦敦家宽 · 01</div><div class="lbl" style="margin-top: 4px">团队套餐可用 · <span style="color: #0842C2">升级</span></div></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#56616F" stroke-width="1.8" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></button>
    </div>
    <div style="padding: 12px 14px; border-radius: 12px; background: #fff; border: 1px solid #DCE1E7; font-size: 12.5px; line-height: 1.7; color: #2D3748">
      视频、下载等大流量自动走大带宽节点，不占家宽；大陆流量照常本地直连。线路故障时先提示你，不会悄悄换地区。
    </div>
    <div style="display: flex; gap: 10px; margin-top: auto">
      <button style="flex: 1; height: 50px; border-radius: 14px; border: 1px solid #DCE1E7; background: #fff; font-size: 15px; font-weight: 600">按订阅分流</button>
      <button style="flex: 1.4; height: 50px; border-radius: 14px; border: 0; background: #0A55F5; color: #fff; font-size: 15px; font-weight: 600">使用东京家宽 · 04</button>
    </div>
  </div>
</div>
</body>
</html>
