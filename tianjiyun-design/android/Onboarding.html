<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天机云 Android 首次导入</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
.lbl{font-size:12px;color:#56616F}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.step{flex:1;height:4px;border-radius:2px;background:#C9D0D8}
.step.on{background:#0A55F5}
.big{height:54px;border-radius:14px;font-size:16px;font-weight:600;border:0;width:100%;cursor:pointer}
</style>
<!-- 精致化层（Apple 质感），必须在各页基础样式之后加载 -->
<link rel="stylesheet" href="../assets/polish.css">
<style>html{background:#D9DEE5}body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px}.__back{position:fixed;left:12px;top:10px;font:12px system-ui;color:#56616F;text-decoration:none;z-index:9999}</style>
</head>
<body>
<a class="__back" href="../index.html">← 全部页面</a>
<!-- 画板尺寸: 390×844 -->
<div style="width: 390px; height: 844px; background: #F7F8FA; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #0E1726; display: flex; flex-direction: column; padding: 24px 20px 24px; overflow: hidden">
  <div style="display: flex; gap: 6px"><span class="step on"></span><span class="step on"></span><span class="step"></span></div>
  <div class="lbl" style="margin-top: 10px">第 2 步，共 3 步 · 校验订阅</div>

  <div style="margin-top: 36px; width: 64px; height: 64px; border-radius: 18px; background: #FDF1E3; display: grid; place-items: center">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#A15C00" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg>
  </div>
  <h1 style="margin: 20px 0 0; font-size: 26px; line-height: 1.35; font-weight: 700">这个订阅已经过期</h1>
  <p style="margin: 10px 0 0; font-size: 15px; line-height: 1.7; color: #2D3748">链接本身没问题，但套餐在 2026-11-05 到期了。续费后回到这里点「重新校验」即可，不用重新复制链接。</p>

  <div style="margin-top: 24px; background: #fff; border: 1px solid #DCE1E7; border-radius: 16px; padding: 16px">
    <div class="lbl">你粘贴的链接</div>
    <div class="mono" style="font-size: 12.5px; color: #2D3748; margin-top: 6px; word-break: break-all">https://sub.tianjiyun.org/api/v1/client/subscribe?token=••••••••</div>
    <div style="height: 1px; background: #EEF1F4; margin: 14px 0"></div>
    <div style="display: flex; justify-content: space-between; font-size: 14px"><span>套餐</span><span style="font-weight: 600">个人畅享</span></div>
    <div style="display: flex; justify-content: space-between; font-size: 14px; margin-top: 8px"><span>状态</span><span style="font-weight: 600; color: #A15C00">已过期 3 天</span></div>
  </div>

  <div style="margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: #EEF1F4; font-size: 13px; line-height: 1.6; color: #2D3748">之前的配置已保留，客户端仍可正常使用。</div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
    <button class="big" style="background: #0A55F5; color: #fff">去续费</button>
    <button class="big" style="background: #fff; border: 1px solid #DCE1E7">重新校验</button>
    <a href="Profiles.html" style="text-align: center; font-size: 14px; color: #0842C2; text-decoration: none; padding: 8px">换一个订阅链接</a>
  </div>
</div>
</body>
</html>
