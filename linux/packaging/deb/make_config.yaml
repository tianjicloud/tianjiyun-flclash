display_name: 天机云
package_name: tianjicloud
maintainer:
  name: Tianji Cloud
  email: business@tianjiyun.org

priority: optional
section: x11
installed_size: 6604
essential: false
icon: ./assets/images/icon.png

dependencies:
  - libayatana-appindicator3-1
  - libsecret-1-0

# The Helper unit is written on demand by the app, not at install time, so only
# its teardown belongs here; the binary is already gone when postrm runs.
postuninstall_scripts:
  - 'case "${1:-}" in remove|purge) ;; *) exit 0 ;; esac'
  - 'systemctl disable --now tianjicloud-helper.service >/dev/null 2>&1 || true'
  - 'rm -f /etc/systemd/system/tianjicloud-helper.service'
  - 'systemctl daemon-reload >/dev/null 2>&1 || true'

supported_mime_type:
  - x-scheme-handler/clash
  - x-scheme-handler/clashmeta
  - x-scheme-handler/tianji

keywords:
  - 天机云
  - TianjiCloud
  - Clash
  - ClashMeta
  - Proxy

generic_name: 天机云

categories:
  - Network

startup_notify: true

startup_wm_class: org.tianjiyun.app
