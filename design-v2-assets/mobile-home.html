<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Noto Sans CJK SC","PingFang SC",sans-serif; }
  body { width:390px; height:844px; overflow:hidden; color:#EDF0FF; position:relative;
    background:
      radial-gradient(420px 300px at 110% -5%, rgba(124,77,255,.32), transparent 60%),
      radial-gradient(380px 300px at -20% 100%, rgba(61,90,254,.22), transparent 60%),
      linear-gradient(165deg, #0A0F2B 0%, #070B1F 55%, #05081A 100%); }
  .stars { position:absolute; inset:0; background-image:
    radial-gradient(1.5px 1.5px at 40px 90px, rgba(255,255,255,.6), transparent),
    radial-gradient(1px 1px at 150px 40px, rgba(255,255,255,.45), transparent),
    radial-gradient(1.5px 1.5px at 300px 120px, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 350px 300px, rgba(255,255,255,.3), transparent),
    radial-gradient(1px 1px at 60px 420px, rgba(255,255,255,.3), transparent); }
  .wrap { position:relative; padding:14px 18px 0; display:flex; flex-direction:column; height:100%; }
  .statusbar { display:flex; justify-content:space-between; font-size:12.5px; color:#C6CDF2; padding:0 4px 10px; font-variant-numeric:tabular-nums; }
  .topbar { display:flex; align-items:center; gap:10px; }
  .logo-mark { width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#3D5AFE,#7C4DFF); box-shadow:0 6px 18px rgba(61,90,254,.45); font-size:18px; }
  .logo-name { font-size:17px; font-weight:700; letter-spacing:2px; }
  .top-ic { margin-left:auto; width:38px; height:38px; border-radius:12px; background:rgba(255,255,255,.05);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; font-size:16px; }
  .pill { display:flex; align-items:center; gap:7px; font-size:12px; padding:7px 12px; border-radius:999px;
    background:rgba(52,224,176,.10); color:#4CE8BC; box-shadow:inset 0 0 0 1px rgba(52,224,176,.30); }
  .pill .dot { width:7px; height:7px; border-radius:50%; background:#34E0B0; box-shadow:0 0 8px #34E0B0; }

  .hero { display:flex; flex-direction:column; align-items:center; padding:14px 0 2px; }
  .orbit { width:138px; height:138px; border-radius:50%; position:relative;
    background:radial-gradient(circle at 35% 30%, #5B78FF, #3D5AFE 45%, #2A3FBF 100%);
    box-shadow:0 0 0 9px rgba(61,90,254,.12), 0 0 54px rgba(61,90,254,.55), inset 0 -12px 26px rgba(10,10,60,.45);
    display:flex; align-items:center; justify-content:center; }
  .orbit::before { content:""; position:absolute; inset:-20px; border-radius:50%; border:1.5px dashed rgba(124,140,255,.35); }
  .orbit::after { content:""; position:absolute; inset:-20px; border-radius:50%;
    background:radial-gradient(3.5px 3.5px at 88% 30%, #9DB1FF, transparent); }
  .orbit .power { font-size:44px; color:#fff; line-height:1; }
  .hero-status { margin-top:26px; font-size:14.5px; } .hero-status b { color:#4CE8BC; }
  .hero-ip { font-size:25px; font-weight:800; margin-top:8px; font-variant-numeric:tabular-nums; letter-spacing:.5px; }
  .chips { display:flex; gap:7px; margin-top:10px; flex-wrap:wrap; justify-content:center; }
  .chip { font-size:11.5px; padding:5px 10px; border-radius:999px; background:rgba(255,255,255,.06);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.09); color:#C6CDF2; }
  .chip.good { background:rgba(52,224,176,.12); color:#4CE8BC; box-shadow:inset 0 0 0 1px rgba(52,224,176,.30); }
  .chip.home { background:rgba(124,77,255,.14); color:#B79CFF; box-shadow:inset 0 0 0 1px rgba(124,77,255,.35); }
  .hero-meta { display:flex; gap:26px; margin-top:12px; font-size:13px; color:#98A2C8; font-variant-numeric:tabular-nums; }
  .hero-meta b { color:#EDF0FF; font-size:14.5px; }

  .seg { display:flex; background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.07); border-radius:14px; padding:4px; gap:4px; margin-top:14px; }
  .seg div { flex:1; text-align:center; padding:8px 0; border-radius:11px; font-size:14px; color:#98A2C8; }
  .seg div.on { color:#fff; font-weight:600; background:linear-gradient(90deg,#3D5AFE,#6A5CFF); box-shadow:0 6px 16px rgba(61,90,254,.40); }

  .panel { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.075); border-radius:20px; }
  .home-card { margin-top:12px; padding:14px 16px;
    background:linear-gradient(160deg, rgba(124,77,255,.13), rgba(61,90,254,.05) 55%, rgba(255,255,255,.03));
    border:1px solid rgba(140,120,255,.35); border-radius:20px; }
  .card-head { display:flex; align-items:center; font-size:13px; font-weight:600; color:#C6CDF2; }
  .tag { margin-left:auto; font-size:11px; padding:3px 9px; border-radius:999px; background:rgba(52,224,176,.12); color:#4CE8BC; }
  .home-name { font-size:20px; font-weight:800; margin:9px 0 4px; }
  .home-sub { font-size:12px; color:#98A2C8; }
  .home-row { display:flex; justify-content:space-between; align-items:center; margin-top:10px; }
  .home-row .lat { font-size:12.5px; color:#98A2C8; } .home-row .lat b { color:#EDF0FF; }
  .btn { padding:9px 18px; border-radius:11px; font-size:13px; font-weight:600;
    background:linear-gradient(90deg,#3D5AFE,#6A5CFF); box-shadow:0 6px 16px rgba(61,90,254,.35); }

  .duo { display:flex; gap:12px; margin-top:10px; }
  .mini { flex:1; padding:12px 14px; }
  .mini label { font-size:11px; color:#7E88B3; letter-spacing:1px; display:block; margin-bottom:7px; }
  .mini b { font-size:16px; font-variant-numeric:tabular-nums; }
  .mini .sub { font-size:11px; color:#98A2C8; margin-top:4px; }
  .bar { height:6px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; margin-top:9px; }
  .bar i { display:block; height:100%; width:5%; border-radius:99px; background:linear-gradient(90deg,#3D5AFE,#9D6BFF); }
  .bar2 i { width:82%; }
  .amber { color:#FFC24D !important; }

  .tabbar { margin-top:auto; display:flex; padding:10px 8px 14px; border-top:1px solid rgba(255,255,255,.06);
    background:rgba(7,10,28,.6); margin-left:-18px; margin-right:-18px; padding-left:26px; padding-right:26px; }
  .tab { flex:1; text-align:center; font-size:11px; color:#7E88B3; }
  .tab .tic { font-size:19px; display:block; margin-bottom:3px; }
  .tab.on { color:#8FA2FF; }
</style>
</head>
<body>
<div class="stars"></div>
<div class="wrap">
  <div class="statusbar"><span>18:42</span><span>5G ▂▄▆ · 86%</span></div>
  <div class="topbar">
    <div class="logo-mark">☁</div><div class="logo-name">天机云</div>
    <div class="pill" style="margin-left:auto;"><span class="dot"></span>已连接</div>
    <div class="top-ic">⚙</div>
  </div>

  <div class="hero">
    <div class="orbit"><span class="power">⏻</span></div>
    <div class="hero-status">点击断开 · <b>连接中 02:14:36</b></div>
    <div class="hero-ip">126.51.252.247</div>
    <div class="chips">
      <span class="chip">🇯🇵 日本 · 东京</span><span class="chip home">🏠 住宅 IP</span><span class="chip good">质量 优</span>
    </div>
    <div class="hero-meta"><span>延迟 <b>38 ms</b></span><span>↓ <b>12.4 MB/s</b></span><span>SOFTBANK</span></div>
  </div>

  <div class="seg"><div class="on">☀ 日常</div><div>🤖 AI</div><div>🎬 观影</div></div>

  <div class="home-card">
    <div class="card-head">🛡 家宽线路 <span class="tag">跟随中</span></div>
    <div class="home-name">🇺🇸 美国家宽</div>
    <div class="home-sub">洛杉矶 · Spectrum 住宅宽带 · 需要代理的流量自动走此出口</div>
    <div class="home-row"><span class="lat">线路延迟 <b>142 ms</b> · 本月 3.6 GB</span><div class="btn">更换线路</div></div>
  </div>

  <div class="duo">
    <div class="panel mini"><label>本月流量</label><b>10.2 <small>/ 200 GB</small></b><div class="bar"><i></i></div><div class="sub">已用 5%</div></div>
    <div class="panel mini"><label>订阅 · 天机 TIANJI(1)</label><b class="amber">剩余 28 天</b><div class="bar bar2"><i></i></div><div class="sub">到期 2026-12-05 · 自动更新</div></div>
  </div>

  <div class="tabbar">
    <div class="tab on"><span class="tic">▦</span>仪表盘</div>
    <div class="tab"><span class="tic">◎</span>代理</div>
    <div class="tab"><span class="tic">▤</span>配置</div>
    <div class="tab"><span class="tic">⚒</span>工具</div>
  </div>
</div>
</body>
</html>
